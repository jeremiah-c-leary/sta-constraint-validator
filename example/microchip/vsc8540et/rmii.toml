# stacv interface file for the VSC8540ET RMII MAC interface.
#
# Paths are relative to this file.
#
# All periods are in nanoseconds

description = "VSC8540ET RMII MAC interface"

name = "VSC8540_RMII"
part = "vsc8540et.toml"
part_interface = "RMII"
traces = "traces.toml"

[[clock]]
name = "rmii_ref_clk"
period = 20.000
port = "I_RMII_REF_CLK"

[[port]]
name = "O_RMII_TXD[1:0]"
methodology = "SDR-SYS-O"
launch_clock = {name = "rmii_ref_clk", setup_edge = 0, hold_edge = 0}
capture_clock = {name = "rmii_ref_clk", setup_edge = 2, hold_edge = 0}
registers = ["q_rmii_txd_reg[*]"]
timing_reports = [
    "$PROJ_DIR/example/microchip/vsc8540et/timing_reports/O_RMII_TXD_timing.rpt",
]

[[port]]
name = "O_RMII_TX_EN"
methodology = "SDR-SYS-O"
launch_clock = {name = "rmii_ref_clk", setup_edge = 0, hold_edge = 0}
capture_clock = {name = "rmii_ref_clk", setup_edge = 2, hold_edge = 0}
registers = ["q_rmii_tx_en_reg"]
timing_reports = [
    "$PROJ_DIR/example/microchip/vsc8540et/timing_reports/O_RMII_TX_EN_timing.rpt",
]

[[port]]
name = "O_RMII_TX_ER"
methodology = "SDR-SYS-O"
launch_clock = {name = "rmii_ref_clk", setup_edge = 0, hold_edge = 0}
capture_clock = {name = "rmii_ref_clk", setup_edge = 2, hold_edge = 0}
registers = ["q_rmii_tx_er_reg"]
timing_reports = [
    "$PROJ_DIR/example/microchip/vsc8540et/timing_reports/O_RMII_TX_ER_timing.rpt",
]

[[port]]
name = "I_RMII_RXD[1:0]"
methodology = "SDR-SYS-I"
launch_clock = {name = "rmii_ref_clk", setup_edge = 0, hold_edge = 0}
capture_clock = {name = "rmii_ref_clk", setup_edge = 2, hold_edge = 0}
registers = ["q_rmii_rxd_reg[*]"]
timing_reports = [
    "$PROJ_DIR/example/microchip/vsc8540et/timing_reports/I_RMII_RXD_timing.rpt",
]

[[port]]
name = "I_RMII_CRS_DV"
methodology = "SDR-SYS-I"
launch_clock = {name = "rmii_ref_clk", setup_edge = 0, hold_edge = 0}
capture_clock = {name = "rmii_ref_clk", setup_edge = 2, hold_edge = 0}
registers = ["q_rmii_crs_dv_reg"]
timing_reports = [
    "$PROJ_DIR/example/microchip/vsc8540et/timing_reports/I_RMII_CRS_DV_timing.rpt",
]

[[port]]
name = "I_RMII_RX_ER"
methodology = "SDR-SYS-I"
launch_clock = {name = "rmii_ref_clk", setup_edge = 0, hold_edge = 0}
capture_clock = {name = "rmii_ref_clk", setup_edge = 2, hold_edge = 0}
registers = ["q_rmii_rx_er_reg"]
timing_reports = [
    "$PROJ_DIR/example/microchip/vsc8540et/timing_reports/I_RMII_RX_ER_timing.rpt",
]
