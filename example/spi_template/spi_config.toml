# stacv SPI configuration file for a 4-wire SPI interface, SPI mode 1, with the device as the controller.
# Created by:  stacv create template spi --wires 4 --mode 1 --type controller --clock-period 10 --sck-period 40
#
# Keys are described in:
# https://github.com/jeremiah-c-leary/sta-constraint-validator/blob/main/docs/source/spi_config.rst
#
# stacv generates the interface file, the constraints and the report script
# from this file.  Only this file, the part file and the traces file are edited.
#
# Replace each FROM_DESIGN with the name in your design; stacv stops on it until then.
# Registers are named as Vivado names them:  the hierarchy separated by /, with
# _reg added, and a bit of a bus in brackets, such as u_spi/rx_shift_reg[0].
#
# SPI mode 1:  SCK idles low, data changes on the rising edge and is sampled on the falling edge.
#
# Edges:  each launch and capture is counted in device clocks from a named edge
#         of SCK, as the HDL counts them:  -4 is four device clock periods before
#         that edge, 0.5 half a period after it (a register on the falling edge).
#         The values below are the usual ones for the mode; read the HDL, correct
#         them, and say in source where each comes from.  Check them with:
#             stacv visualize edges spi_config.toml
#         A negative hold requirement in the drawing means the signal changes
#         after the edge that captures it.
#
# Periods are in nanoseconds.  Paths are relative to this file.

interface = "spi"
name      = "SPI"
mode      = 1
role      = "controller"

part    = "part.toml"
traces  = "traces.toml"

timing_reports_dir = "timing_reports"

# The device clock the SPI logic runs on.
[device_clock]
name   = "FROM_DESIGN"
period = 10.0

# SCK, the SPI clock: generated in the device by a register and forwarded to the part.
[sck]
port     = "FROM_DESIGN"
register = "FROM_DESIGN"
period   = 40.0

# COPI: data from the device into the part.
#   launch:   when the design changes COPI, from the SCK change edge (rising)
#             20 ns before the falling sample edge that captures it.
[copi]
port     = "FROM_DESIGN"
register = "FROM_DESIGN"
launch   = {sck_edge = "change", clocks = 0, source = "FROM_DESIGN"}

# CIPO: data from the part into the device.
#   capture:  when the device captures CIPO, from the SCK sample edge (falling)
#             20 ns after the rising change edge the part launches it on.
#             0 is the device clock edge that makes that SCK edge.
[cipo]
port     = "FROM_DESIGN"
register = "FROM_DESIGN"
capture  = {sck_edge = "sample", clocks = 0, source = "FROM_DESIGN"}

# CS: selects the part.  Timed to the first and last falling edges of SCK.
#   assert:   when CS becomes active, from the first SCK sample edge;
#             -4 is one SCK period (40 ns) before it.
#   deassert: when CS becomes inactive, from the last SCK change edge (rising),
#             or with sck_edge = "last sample", from the last sample edge.
[cs]
port     = "FROM_DESIGN"
register = "FROM_DESIGN"
assert   = {sck_edge = "first sample", clocks = -4, source = "FROM_DESIGN"}
deassert = {sck_edge = "last change", clocks = 0, source = "FROM_DESIGN"}
