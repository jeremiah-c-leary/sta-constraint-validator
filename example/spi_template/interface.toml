# stacv interface file for a 4-wire SPI interface, SPI mode 0, with the device as the controller.
# Created by:  stacv create template spi --wires 4 --mode 0 --type controller --clock-period 10 --sck-period 40
#
# Keys are described in:
# https://github.com/jeremiah-c-leary/sta-constraint-validator/blob/main/docs/source/interface.rst
# The SPI signals and modes are described in:
# https://github.com/jeremiah-c-leary/sta-constraint-validator/blob/main/docs/source/standards.rst
#
# Rename the clocks, ports and registers to your design's, and SPI_INTERFACE_NAME everywhere it appears.
# Keep each if_signal as it is: it links the port to its trace and its part pin.
# Check the edges against the part's datasheet with:  stacv visualize edges interface.toml
#
# SPI mode 0:  SCK idles low, data changes on the falling edge and is sampled on the rising edge.
#
# Paths are relative to this file.
#
# All periods are in nanoseconds.

description = "SPI_DESCRIPTION"
name = "SPI_INTERFACE_NAME"
part = "part.toml"
part_interface = "SPI"
traces = "traces.toml"
if_standard = "SPI mode 0"
if_role = "controller"

# The device clock the SPI logic runs on.
[[clock]]
name = "device_clk"
period = 10.000

# SCK, generated from device_clk and forwarded to the part.
[[clock]]
name = "spi_sck"
period = 40.000
port = "O_SPI_SCK"
idle = "low"
if_signal = "SCK"
generator = {source = "q_spi_sck_reg", master_pin = "C", target_pin = "Q", master_clock = "device_clk"}

# COPI changes on the falling edge of SCK, and the part samples it on the next rising edge.
[[port]]
status = "analyze"
name = "O_SPI_COPI"
methodology = "SDR-SS-O"
if_signal = "COPI"
launch_clock = {name = "device_clk", setup_edge = 4, hold_edge = 4}
capture_clock = {name = "spi_sck", setup_edge = "C", hold_edge = "A"}
registers = ["q_spi_copi_reg"]
timing_reports = [
    "timing_reports/SPI_INTERFACE_NAME.COPI_timing.rpt",
]

# CS is timed to the first and last rising edges of SCK.
[[port]]
status = "analyze"
name = "O_SPI_CS"
methodology = "SDR-SS-O-FLC"
if_signal = "CS"
launch_clock = {name = "device_clk", setup_edge = 0, hold_edge = 4}
capture_clock = {name = "spi_sck", setup_edge = "C", hold_edge = "A"}
registers = ["q_spi_cs_reg"]
timing_reports = [
    "timing_reports/SPI_INTERFACE_NAME.CS_timing.rpt",
]

# The part changes CIPO on the falling edge of SCK, and the device captures it on device_clk at the next rising edge.
[[port]]
status = "analyze"
name = "I_SPI_CIPO"
methodology = "SDR-SS-RT-DI"
if_signal = "CIPO"
launch_clock = {name = "spi_sck", setup_edge = 1, hold_edge = 1}
capture_clock = {name = "device_clk", setup_edge = "I", hold_edge = "A"}
registers = ["q_spi_cipo_reg"]
timing_reports = [
    "timing_reports/SPI_INTERFACE_NAME.CIPO_timing.rpt",
]
