# stacv interface file for a 4-wire SPI interface, SPI mode 1, with the device as the controller.
# Created by:  stacv create template spi --wires 4 --mode 1 --type controller --clock-period 10 --sck-period 40
#
# Keys are described in:
# https://github.com/jeremiah-c-leary/sta-constraint-validator/blob/main/docs/source/interface.rst
# The SPI signals and modes are described in:
# https://github.com/jeremiah-c-leary/sta-constraint-validator/blob/main/docs/source/standards.rst
#
# Rename the clocks, ports and registers to your design's, and SPI_INTERFACE_NAME everywhere it appears.
# Keys below each "set by stacv create template spi" line are set from the command line above;
# create the files again to change them.
# Check the edges against the part's datasheet with:  stacv visualize edges interface.toml
#
# SPI mode 1:  SCK idles low, data changes on the rising edge and is sampled on the falling edge.
#
# Paths are relative to this file.
#
# All periods are in nanoseconds.

description = "SPI_DESCRIPTION"
name = "SPI_INTERFACE_NAME"
part = "part.toml"
part_interface = "SPI"
traces = "traces.toml"
#--- set by stacv create template spi; do not change below ---
if_standard = "SPI mode 1"
if_role = "controller"

# The device clock the SPI logic runs on.
[[clock]]
name = "device_clk"
#--- set by stacv create template spi; do not change below ---
period = 10.000

# SCK, generated from device_clk and forwarded to the part.
[[clock]]
name = "spi_sck"
port = "O_SPI_SCK"
generator = {source = "q_spi_sck_reg", master_pin = "C", target_pin = "Q", master_clock = "device_clk"}
#--- set by stacv create template spi; do not change below ---
period = 40.000
idle = "low"
if_signal = "SCK"

# COPI changes on the rising edge of SCK, and the part samples it on the next falling edge.
[[port]]
status = "analyze"
name = "O_SPI_COPI"
registers = ["q_spi_copi_reg"]
launch_clock = {name = "device_clk", setup_edge = 8, hold_edge = 8}
capture_clock = {name = "spi_sck", setup_edge = "D", hold_edge = "B"}
timing_reports = [
    "timing_reports/SPI_INTERFACE_NAME.COPI_timing.rpt",
]
#--- set by stacv create template spi; do not change below ---
methodology = "SDR-SS-O"
if_signal = "COPI"

# CS is timed to the first and last falling edges of SCK.
[[port]]
status = "analyze"
name = "O_SPI_CS"
registers = ["q_spi_cs_reg"]
launch_clock = {name = "device_clk", setup_edge = 4, hold_edge = 8}
capture_clock = {name = "spi_sck", setup_edge = "D", hold_edge = "B"}
timing_reports = [
    "timing_reports/SPI_INTERFACE_NAME.CS_timing.rpt",
]
#--- set by stacv create template spi; do not change below ---
methodology = "SDR-SS-O-FLC"
if_signal = "CS"

# The part changes CIPO on the rising edge of SCK, and the device captures it on device_clk at the next falling edge.
[[port]]
status = "analyze"
name = "I_SPI_CIPO"
registers = ["q_spi_cipo_reg"]
launch_clock = {name = "spi_sck", setup_edge = 2, hold_edge = 2}
capture_clock = {name = "device_clk", setup_edge = "M", hold_edge = "E"}
timing_reports = [
    "timing_reports/SPI_INTERFACE_NAME.CIPO_timing.rpt",
]
#--- set by stacv create template spi; do not change below ---
methodology = "SDR-SS-RT-DI"
if_signal = "CIPO"
