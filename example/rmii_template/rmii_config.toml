# stacv RMII configuration file, with the device as the MAC.
# Created by:  stacv create template rmii
#
# Keys are described in:
# https://github.com/jeremiah-c-leary/sta-constraint-validator/blob/main/docs/source/rmii_config.rst
#
# stacv generates the interface file, the constraints and the report script
# from this file.  Only this file, the part file and the traces file are edited.
#
# Replace each FROM_DESIGN_... with the name in your design; stacv stops on it until then.
# Each placeholder is named after its key, so it can be found and replaced on its own.
# Registers are named as Vivado names them:  the hierarchy separated by /, with
# _reg added, and the bits of a bus as reg[*], such as u_mac/rmii_txd_reg[*].
#
# RMII:  every signal is launched and captured on the rising edge of the 50 MHz
#        REF_CLK, at the MAC and at the PHY, so there are no edges or periods to
#        set.  Where REF_CLK comes from (the PHY, the MAC or an oscillator) is in
#        the traces file: its delay to each end.
#
# Paths are relative to this file.

interface = "rmii"
name      = "RMII"
role      = "MAC"

part    = "part.toml"
traces  = "traces.toml"

timing_reports_dir = "timing_reports"

# REF_CLK: the 50 MHz reference clock the MAC receives: the clock's name in the
# constraints, and the port it arrives on.
[ref_clk]
name = "FROM_DESIGN_REF_CLK_NAME"
port = "FROM_DESIGN_REF_CLK_PORT"

# TXD[1:0], TX_EN and TX_ER: data from the MAC to the PHY.
# TX_ER and RX_ER are optional in RMII: if the design does not use one, remove its
# table here and its trace in the traces file.
[txd]
port     = "FROM_DESIGN_TXD_PORT"
register = "FROM_DESIGN_TXD_REGISTER"

[tx_en]
port     = "FROM_DESIGN_TX_EN_PORT"
register = "FROM_DESIGN_TX_EN_REGISTER"

[tx_er]
port     = "FROM_DESIGN_TX_ER_PORT"
register = "FROM_DESIGN_TX_ER_REGISTER"


# RXD[1:0], CRS_DV and RX_ER: data from the PHY to the MAC.
[rxd]
port     = "FROM_DESIGN_RXD_PORT"
register = "FROM_DESIGN_RXD_REGISTER"

[crs_dv]
port     = "FROM_DESIGN_CRS_DV_PORT"
register = "FROM_DESIGN_CRS_DV_REGISTER"

[rx_er]
port     = "FROM_DESIGN_RX_ER_PORT"
register = "FROM_DESIGN_RX_ER_REGISTER"

