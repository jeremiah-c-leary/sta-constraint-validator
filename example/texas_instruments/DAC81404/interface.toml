# stacv configuration for the DAC81404 example.
#
# Paths may use environment variables, e.g. $PROJ_DIR, so each user
# controls where their files live.
#
# All periods are in nanoseconds

description = "DAC81404 serial interface, write path only"

# device = "$PROJ_DIR/example/xilinx/ultrascale_plus.toml"

name = "DAC_SPI_1"
part = "$PROJ_DIR/example/texas_instruments/DAC81404/part.toml"     # stage 3
traces = "$PROJ_DIR/example/texas_instruments/DAC81404/traces.toml" # stage 3

[[clock]]
name = "clk_100mhz"
period = 10.000

[[clock]]
name = "dac_sclk"
period = 50.000
port = "O_DAC_SCLK"
generator = {source = "q_spi_output_clock_reg", master_pin = "C", target_pin = "Q", master_clock = "clk_100mhz"}

[[port]]
status = "analyze"
name = "O_DAC_DATA"
methodology = "SDR-SS-O"
launch_clock = {name = "clk_100mhz", setup_edge = 8, hold_edge = 0}
capture_clock = {name = "dac_sclk", setup_edge = "C", hold_edge = "A"}
timing_reports = [
    "$PROJ_DIR/example/texas_instruments/DAC81404/timing_reports/O_DAC_DATA_timing.rpt",
]

[[port]]
status = "defer"
name = "O_DAC_CSF"
methodology = "SDR-SS-O"
launch_clock = {name = "clk_100mhz", setup_edge = 8, hold_edge = 0}
capture_clock = {name = "dac_sclk", setup_edge = "C", hold_edge = "A"}
timing_reports = [
    "$PROJ_DIR/example/texas_instruments/DAC81404/timing_reports/O_DAC_CSF_timing.rpt",
]

[[port]]
status = "defer"
name = "I_DAC_DATA"
methodology = "SDR-SS-RT"
launch_clock = {name = "dac_sclk", setup_edge = "C", hold_edge = "A"}
capture_clock = {name = "clk_100mhz", setup_edge = 8, hold_edge = 0}
timing_reports = [
    "$PROJ_DIR/example/texas_instruments/DAC81404/timing_reports/I_DAC_DATA_timing.rpt",
]
