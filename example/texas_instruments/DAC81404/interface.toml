# stacv configuration for the DAC81404 example.
#
# Paths are relative to this file.
#
# All periods are in nanoseconds

description = "DAC81404 serial interface"

# device = "$PROJ_DIR/example/xilinx/ultrascale_plus.toml"

name = "DAC_SPI_1"
part = "part.toml"
traces = "traces.toml"

[[clock]]
name = "clk_100mhz"
period = 10.000

[[clock]]
name = "dac_sclk"
period = 40.000
port = "O_DAC_SCLK"
idle = "low"
generator = {source = "q_spi_output_clock_reg", master_pin = "C", target_pin = "Q", master_clock = "clk_100mhz"}

[[clock]]
name = "dac_sclk_rd"
period = 80.000
port = "O_DAC_SCLK"
idle = "low"
generator = {source = "q_spi_output_clock_reg", master_pin = "C", target_pin = "Q", master_clock = "clk_100mhz"}

[[port]]
status = "analyze"
name = "O_DAC_DATA"
methodology = "SDR-SS-O"
launch_clock = {name = "clk_100mhz", setup_edge = 8, hold_edge = 8}
capture_clock = {name = "dac_sclk", setup_edge = "D", hold_edge = "B"}
timing_reports = [
    "$PROJ_DIR/example/texas_instruments/DAC81404/timing_reports/O_DAC_DATA_timing.rpt",
]

[[port]]
status = "analyze"
name = "O_DAC_SDEN_F"
methodology = "SDR-SS-O-FLC"
launch_clock = {name = "clk_100mhz", setup_edge = 4, hold_edge = 8}
capture_clock = {name = "dac_sclk", setup_edge = "D", hold_edge = "B"}
timing_reports = [
    "$PROJ_DIR/example/texas_instruments/DAC81404/timing_reports/O_DAC_SDEN_F_timing.rpt",
]

[[port]]
status = "analyze"
name = "I_DAC_DATA"
methodology = "SDR-SS-RT-DI"
launch_clock = {name = "dac_sclk_rd", setup_edge = 2, hold_edge = 2}
capture_clock = {name = "clk_100mhz", setup_edge = "Y", hold_edge = "I"}
timing_reports = [
    "$PROJ_DIR/example/texas_instruments/DAC81404/timing_reports/I_DAC_DATA_timing.rpt",
]
