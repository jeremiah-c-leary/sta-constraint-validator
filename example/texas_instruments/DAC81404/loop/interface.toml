# stacv interface for one full loop on the DAC81404 example design:
# generate the constraints, run them through Vivado, and check the timing reports.
#
# Paths are relative to this file.
#
# All periods are in nanoseconds

description = "DAC81404 serial interface, write path only, 25 MHz SCLK"

name = "DAC_SPI_1"
part = "../part.toml"
traces = "../traces.toml"

[[clock]]
name = "clk_100mhz"
period = 10.000

[[clock]]
name = "dac_sclk"
period = 40.000
port = "O_DAC_SCLK"
generator = {source = "q_spi_output_clock_reg", master_pin = "C", target_pin = "Q", master_clock = "clk_100mhz"}

[[port]]
name = "O_DAC_DATA"
methodology = "SDR-SS-O"
launch_clock = {name = "clk_100mhz", setup_edge = 0, hold_edge = 8}
capture_clock = {name = "dac_sclk", setup_edge = "B", hold_edge = "B"}
timing_reports = [
    "timing_reports/O_DAC_DATA_timing.rpt",
]
