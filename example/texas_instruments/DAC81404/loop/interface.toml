# stacv interface for one full loop on the DAC81404 example design:
# generate the constraints, run them through Vivado, and check the timing reports.
#
# Paths are relative to this file.
#
# All periods are in nanoseconds

description = "DAC81404 serial interface, write path only, 25 MHz SCLK"

interface = "DAC_SPI_1"
part = "../part.toml"
traces = "../traces.toml"

[[port]]
name = "O_DAC_DATA"
methodology = "SDR-SS-O"
launch_clock = {name = "clk_100mhz", period = 10.000, setup_edge = 0, hold_edge = 8}
capture_clock = {port = "O_DAC_SCLK", name = "dac_sclk", period = 40.000, generator = {source = "q_spi_output_clock_reg", master_pin = "C", target_pin = "Q"}, setup_edge = "B", hold_edge = "B"}
timing_reports = [
    "timing_reports/O_DAC_DATA_timing.rpt",
]
