  28606d49e53d58f11f2ea39d54b34a68  timing_reports/O_DAC_SDEN_F_timing.rpt
  4647b00342eb32e12845ecf4dddc8f17  timing_reports/I_DAC_DATA_timing.rpt

===============================================================================
2  Timing
===============================================================================

  Pin           Parameter   Value   Unit
  ------------  ---------  -------  ----
  O_DAC_DATA    tCOmin      -0.908  ns
                tCOmax       0.689  ns
  ------------  ---------  -------  ----
  O_DAC_SDEN_F  tB          39.234  ns
                tA          19.158  ns
  ------------  ---------  -------  ----
  I_DAC_DATA    tSU        -13.842  ns
                tH          18.165  ns

Every time is at the device's pins, against the edge of O_DAC_SCLK at its pin.
Each value is the worst of the Slow and Fast process corners.
The rising and falling edges of O_DAC_SCLK are assumed to leave the device
with the same delay.

In the drawings, # is where the signal may change, and each X is a limit that
a symbol gives.

===============================================================================
3  O_DAC_DATA
===============================================================================

The data changes after each rising edge of O_DAC_SCLK, and is captured on the
falling edge.

                                   ____________________
  O_DAC_SCLK  ____________________/

                   |<-- tCOmin -->|<-- tCOmax -->|
              _____ _____________________________ _____
  O_DAC_DATA  _____X#############################X_____

===============================================================================
4  O_DAC_SDEN_F
===============================================================================

A chip select, timed to the first and last falling edges of O_DAC_SCLK, which
stops between transfers.

                ____________________
  O_DAC_SCLK                        \_____

                     |<---- tB ---->|
                _____ ____________________
  O_DAC_SDEN_F  #####X____________________

                _____
  O_DAC_SCLK         \____________________

                     |<---- tA ---->|
                ____________________ _____
  O_DAC_SDEN_F  ____________________X#####

===============================================================================
5  I_DAC_DATA
===============================================================================

The part launches the data on each rising edge of O_DAC_SCLK, and the device
captures it with its own clock, 60 ns after that rising edge at its pins.  The
device needs the data stable from 53.842 ns to 58.165 ns after the rising edge
that launched it:

              _____
  O_DAC_SCLK       \___________________________________

                   |<----------- tH ------------>|
                   |<--- tSU ---->|
              ____________________ ______________ _____
  I_DAC_DATA  ####################X______________X#####

