###############################################################################
#  DAC_SPI_1 Interface Datasheet
###############################################################################

This file is the datasheet of the DAC_SPI_1 interface of the dac81404_spi design.
Generated by stacv version 1.0 from the timing reports of the design.

It gives the timing of each port at the device's pins, as a part datasheet
gives the timing of its pins.  The text is for the reader.  The pin tables
below it have the form of the pins of a stacv part file, so a design that
connects to these pins can copy them into its part file.  stacv does not
read this file.

  Design:   dac81404_spi
  Device:   xa7a12t-cpg238, speed -2I
  Tool:     Vivado v.2020.2
  Corners:  Slow, Fast

===============================================================================
1  References
===============================================================================

  md5sum                            Filename
  --------------------------------  ----------------------------------------
  929aa008b5fe7d1929f0109985a20963  interface.toml
  c58b25e7f777af3f00e728389a614f2e  part.toml
  258b2a541bb317ac41ff5ecd3df5e6cc  traces.toml
  700bbeb6cd003a0ae2511ce9c929ba70  timing_reports/O_DAC_DATA_timing.rpt
  28606d49e53d58f11f2ea39d54b34a68  timing_reports/O_DAC_SDEN_F_timing.rpt
  4647b00342eb32e12845ecf4dddc8f17  timing_reports/I_DAC_DATA_timing.rpt

===============================================================================
2  Pins
===============================================================================

  Pin           Direction  Clock       Edge     Parameter      Min      Max   Unit
  ------------  ---------  ----------  -------  ------------  -------  ------  ----
  O_DAC_SCLK    output     -           -        frequency          -   25     MHz
                                                (reads)             -   12.5   MHz
  O_DAC_DATA    output     O_DAC_SCLK  Rising   clock to out  -0.908   0.689   ns
  O_DAC_SDEN_F  output     O_DAC_SCLK  Falling  valid before  39.234       -   ns
                                                valid after   19.158       -   ns
  I_DAC_DATA    input      O_DAC_SCLK  Falling  setup        -13.842       -   ns
                                                hold          18.165       -   ns

Every time is at the device's pins, against the edge of O_DAC_SCLK at its pin.
Each value is the worst of the Slow and Fast process corners.

===============================================================================
3  O_DAC_DATA
===============================================================================

The data changes after each rising edge of O_DAC_SCLK, and is captured on the
falling edge.

  O_DAC_SCLK  __/‾‾‾‾‾‾‾‾‾\_________/‾‾‾‾‾
              0         20        40
  O_DAC_DATA  =X===================X=====
              |<->|                |
              -0.908 to 0.689 ns after each rising edge

Clock to out, from the timing reports:

  The data is valid before the falling edge by:  setup slack + maximum output delay
  The data is valid after the falling edge by:   hold slack - minimum output delay

  clock to out maximum = half period - valid before
  clock to out minimum = valid after - half period

  Corner  Setup slack  Hold slack  Valid before  Valid after  cko max  cko min
  ------  -----------  ----------  ------------  -----------  -------  -------
  Slow          7.686       7.238        19.686       19.238    0.314   -0.762
  Fast          7.311       7.092        19.311       19.092    0.689   -0.908

  maximum output delay:  12.000 ns,  minimum output delay:  -12.000 ns
  half period of O_DAC_SCLK:  20 ns

===============================================================================
4  O_DAC_SDEN_F
===============================================================================

A chip select, timed to the first and last falling edges of O_DAC_SCLK, which
stops between transfers.

  The chip select is valid before the first falling edge by:  setup slack + maximum output delay
  The chip select is valid after the last falling edge by:    hold slack - minimum output delay

  Corner  Setup slack  Hold slack  Valid before  Valid after
  ------  -----------  ----------  ------------  -----------
  Slow          9.532       6.369        39.532       19.369
  Fast          9.234       6.158        39.234       19.158

  maximum output delay:  30.000 ns,  minimum output delay:  -13.000 ns

===============================================================================
5  I_DAC_DATA
===============================================================================

The part launches the data on each rising edge of O_DAC_SCLK, and the device
captures it with its own clock, 60 ns after that rising edge at its pins.  The
device needs the data stable from 53.842 ns to 58.165 ns after the rising edge
that launched it:

  O_DAC_SCLK  __/‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾\___________________/‾
                0                   40                  80
  I_DAC_DATA  XXXXXXXXXXXXXXXXXXXXXXXXXXXXX===XXXXXXXXXXXX

  X  the data may change     =  the data must be stable     each column is 2 ns

     0.000 ns  the part launches the data on the rising edge
    40.000 ns  the falling edge, which setup and hold are given to
    53.842 ns  the data must be valid
    58.165 ns  the next data may change
    60.000 ns  the device captures, inside the device

The window is given in two forms, for the same timing.  Use either.  5.2 is
the form in section 2.

The window is fixed in time, so it holds only at the 12.5 MHz read clock of
O_DAC_SCLK.  At any other frequency it must be calculated again.

5.1  Clock to out the device allows

The part's data may change from -21.835 ns to 53.842 ns after the rising edge
that launches it, at the device's pins:

  clock to out maximum = maximum input delay + setup slack
  clock to out minimum = minimum input delay - hold slack

  Corner  Setup slack  Hold slack  cko max  cko min
  ------  -----------  ----------  -------  -------
  Slow         19.842      26.002   53.842  -25.002
  Fast         22.712      22.835   56.712  -21.835

  maximum input delay:  34.000 ns,  minimum input delay:  1.000 ns

The input delays cancel: each value comes from the device's own paths alone.
The worst is the smallest maximum and the largest minimum.  The part meets
timing when, for both the maximum and the minimum,

  O_DAC_SCLK trace + part clock to out + I_DAC_DATA trace

is within -21.835 ns to 53.842 ns.

5.2  Setup and hold to the falling edge

The same window as a setup and hold to the falling edge of O_DAC_SCLK, 40 ns
after the rising edge that launched the data.  This is the form in section 2.

  setup = 40 ns - clock to out maximum
  hold  = clock to out minimum + 80 ns - 40 ns

  Corner  Setup    Hold
  ------  -------  ------
  Slow    -13.842  14.998
  Fast    -16.712  18.165

  period of O_DAC_SCLK for reads:  80 ns

The setup is negative because the device does not capture on the falling
edge: it captures 20 ns after it, so the data may arrive up to 13.842 ns after
the falling edge.  The hold is to the falling edge after the data was
launched, so the data must stay until 18.165 ns after it, before the next
rising edge launches the next data.

===============================================================================
6  Assumptions
===============================================================================

  * The rising and falling edges of O_DAC_SCLK leave the device with the same
    delay, so each is half a period from the other at the pin.  The clock
    to out of O_DAC_DATA and the setup and hold of I_DAC_DATA depend on it.
  * The clock uncertainty in the slacks, 0.035 ns, is left in: each value is
    0.035 ns worse than the timing alone.
  * The values hold for the placement and routing the timing reports came from.
'''

name = "DAC_SPI_1"

[[pin]]
name = "O_DAC_DATA"
methodology = "SDR-SS-O"
clock = {pin = "O_DAC_SCLK", max_frequency = 25}
launch_edge = "Rising"
cko_max = {value = 0.689, symbol = "tCO", source = "Section 3, Fast corner"}
cko_min = {value = -0.908, symbol = "tCO", source = "Section 3, Fast corner"}

[[pin]]
name = "O_DAC_SDEN_F"
methodology = "SDR-SS-O-FLC"
clock = {pin = "O_DAC_SCLK", max_frequency = 25}
launch_edge = "Falling"
valid_before = {value = 39.234, symbol = "tCSV_B", source = "Section 4, Fast corner"}
valid_after = {value = 19.158, symbol = "tCSV_A", source = "Section 4, Fast corner"}

[[pin]]
name = "I_DAC_DATA"
methodology = "SDR-SS-RT-DI"
clock = {pin = "O_DAC_SCLK", max_frequency = 12.5}
capture_edge = "Falling"
setup = {value = -13.842, symbol = "tSU", source = "Section 5.2, Slow corner"}
hold = {value = 18.165, symbol = "tH", source = "Section 5.2, Fast corner"}
