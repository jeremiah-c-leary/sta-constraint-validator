# SPI configuration for the DAC39RF20 start-up design.
#
# stacv generates the interface file, the constraints and the report script
# from this file before each run.  Only this file, the part file and the
# traces file are edited.
#
# SPI mode 0:  SCK idles low, data changes on the falling edge of SCK and is
#              sampled on the rising edge.
#
# Edges:       each launch and capture is counted in device clocks from a
#              named edge of SCK, as the HDL counts them, with the line of
#              the HDL it comes from.  Check them with:
#                  stacv visualize edges spi_config.toml
#
# Periods are in nanoseconds.  Paths are relative to this file.

interface = "spi"
name      = "DAC_SPI"
mode      = 0
role      = "controller"

part    = "part.toml"
traces  = "traces.toml"

timing_reports_dir = "timing_reports"

# The device clock the SPI logic runs on.
[device_clock]
name   = "sys_clk"
period = 10.0

# SCK, the SPI clock: generated in the device by a register and forwarded to the part.
[sck]
port     = "dac_sclk"
register = "u_spi/sclk_q_reg"
period   = 80.0

# COPI: data from the device into the part.
[copi]
port     = "dac_sdi"
register = "u_spi/sdi_q_reg"
launch   = {sck_edge = "change", clocks = 0, source = "spi_master.vhd: SCLK_HIGH sets sdi_q with sclk_q low"}

# CIPO: data from the part into the device.
[cipo]
port     = "dac_sdo"
register = "u_spi/rx_shift_reg[0]"
capture  = {sck_edge = "sample", clocks = 0, source = "spi_master.vhd: SCLK_LOW shifts sdo into rx_shift with sclk_q high"}

# CS: selects the part.  Timed to the first and last rising edges of SCK.
[cs]
port     = "dac_scs_n"
register = "u_spi/scs_n_q_reg"
assert   = {sck_edge = "first sample", clocks = -4, source = "spi_master.vhd: IDLE clears scs_n_q with the first bit, HALF_PERIOD before sclk_q rises"}
deassert = {sck_edge = "last change", clocks = 4, source = "spi_master.vhd: TRAIL sets scs_n_q HALF_PERIOD after the last sclk_q fall"}
