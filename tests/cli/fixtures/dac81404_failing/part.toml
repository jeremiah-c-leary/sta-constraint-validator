# All delays are in nanoseconds
# All frequencies are in MHz

[properties]
manufacturer = "Texas Instruments"
part_number = "DAC81404"

[datasheet]
name = "DACx1401 Quad, 16-Bit and 12-Bit, High-Voltage-Output DACs With Internal Reference"
url = "https://www.ti.com/lit/ds/symlink/dac81404.pdf"
version = "SLASEH2A -- November 2020 -- REVISED MAY 2021"

[[interface]]
name = "Serial Interface"

[[interface.pin]]
name = "SDIN"
methodology = "SDR-SS-I"
clock = {pin = "SCLK", max_frequency = 25}
capture_edge = "Falling"
setup = {value = 10, symbol = "tSDIS", source = "Table 7.6"}
hold = {value = 10, symbol = "tSDIH", source = "Table 7.6"}

[[interface.pin]]
name = "CSF"
methodology = "SDR-SS-I"
clock = {pin = "SCLK", max_frequency = 25}
capture_edge = "Falling"
setup = {value = 30, symbol = "tCSS", source = "Table 7.6"}
hold = {value = 10, symbol = "tCSH", source = "Table 7.6"}

[[interface.pin]]
name = "SDO"
methodology = "SDR-SS-RT-DO"
clock = {pin = "SCLK", max_frequency = 12.5}
cko_max = {value = 30, symbol = "tSDODLY", source = "Table 7.8"}
cko_min = {value = 0, symbol = "tSDODLY", source = "Table 7.8"}
launch_edge = "Rising"
