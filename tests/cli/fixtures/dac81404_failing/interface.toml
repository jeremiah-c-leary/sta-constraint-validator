# The DAC81404 example after its data trace changed.
#
# The timing report is the example's, run with the constraints for the old data trace.
# Its output delays do not match the new trace delays,
# so check must fail s3_output_delay_001 and s3_output_delay_002.
#
# All periods are in nanoseconds

description = "DAC81404 serial interface, write path only, data trace changed"

name = "DAC_SPI_1"
part = "part.toml"
part_interface = "Serial Interface"
traces = "traces.toml"

[[clock]]
name = "clk_100mhz"
period = 10.000

[[clock]]
name = "dac_sclk"
period = 40.000
port = "O_DAC_SCLK"
generator = {source = "q_spi_output_clock_reg", master_pin = "C", target_pin = "Q", master_clock = "clk_100mhz"}

[[port]]
name = "O_DAC_DATA"
methodology = "SDR-SS-O"
launch_clock = {name = "clk_100mhz", setup_edge = 8, hold_edge = 8}
capture_clock = {name = "dac_sclk", setup_edge = "D", hold_edge = "B"}
registers = ["q_spi_output_data_reg"]
timing_reports = [
    "../../../../example/texas_instruments/DAC81404/timing_reports/O_DAC_DATA_timing.rpt",
]
