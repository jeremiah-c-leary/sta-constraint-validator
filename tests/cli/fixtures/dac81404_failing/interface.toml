# The DAC81404 example before its constraints were corrected.
#
# The output delays in the timing report do not match the part and traces,
# so check must fail s3_output_delay_001 and s3_output_delay_002.
#
# All periods are in nanoseconds

description = "DAC81404 serial interface, write path only, output delays not matching"

name = "DAC_SPI_1"
part = "part.toml"
traces = "traces.toml"

[[clock]]
name = "clk_100mhz"
period = 10.000

[[clock]]
name = "dac_sclk"
period = 50.000
port = "O_DAC_SCLK"
generator = {source = "q_spi_output_clock_reg", master_pin = "C", target_pin = "Q", master_clock = "clk_100mhz"}

[[port]]
name = "O_DAC_DATA"
methodology = "SDR-SS-O"
launch_clock = {name = "clk_100mhz", setup_edge = 8, hold_edge = 0}
capture_clock = {name = "dac_sclk", setup_edge = "C", hold_edge = "A"}
timing_reports = [
    "timing_reports/O_DAC_DATA_timing.rpt",
]
